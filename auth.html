<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Sign Up • ITNotesHub</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-wrap { max-width: 780px; margin: 2rem auto; padding: 0 1rem; }
    .auth-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; }
    .auth-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; box-shadow:var(--shadow); }
    .auth-card h2 { margin:.1rem 0 .8rem; }
    .auth-card label { display:flex; flex-direction:column; gap:.25rem; margin:.45rem 0; }
    .auth-card input { padding:.6rem .7rem; border-radius:8px; border:1px solid var(--border); background:var(--panel-alt); color:var(--text); }
    .msg { margin-top:.6rem; font-size:.85rem; }
    .ok { color:#12b886; }
    .err { color:#ff4d4f; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <p><a href="notes.html">← Back to Notes</a></p>
    <h1 style="margin:.2rem 0 .9rem;">User Login / Sign Up</h1>
    <p style="color:var(--muted);">Login to request and access paid notes after approval.</p>
    <div class="auth-grid">
      <div class="auth-card">
        <h2>Sign Up</h2>
        <label>Name <input id="suName" type="text" /></label>
        <label>Email <input id="suEmail" type="email" /></label>
        <label>Password <input id="suPassword" type="password" /></label>
        <button id="signupBtn" class="btn" type="button">Create Account</button>
        <div id="signupMsg" class="msg"></div>
      </div>
      <div class="auth-card">
        <h2>Login</h2>
        <label>Email <input id="liEmail" type="email" /></label>
        <label>Password <input id="liPassword" type="password" /></label>
        <button id="loginBtn" class="btn" type="button">Login</button>
        <div id="loginMsg" class="msg"></div>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
